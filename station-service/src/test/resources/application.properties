spring.application.name=station-service
server.port = 0

spring.cloud.config.enabled=false


spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=jdbc:postgresql://localhost:5432/station_service-DB
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.initial-interval=2000ms

station.exchange.name=station.events

station.delete.routing.key=station.deleted
station.services.updated.routing.key=station.services.updated

user.exchange.name = user.events
user.success.station.delete.routing.key = user.station.deleted
user.failed.station.delete.routing.key = user.station.failed

user.success.station.delete.queue = station-service.user-station-deleted.queue
user.failed.station.delete.queue=station-service.user-station-failed.queue

dead.letter.exchange.name=common.dlx

dead.letter.queue.name=station-service.dlq

order.exchange = order.events
order.success.station.delete.routing.key = order.station.delete.success
order.failed.station.delete.routing.key = order.station.delete.failed
order.success.station.delete.queue = station-service.order-station-deleted.queue
order.failed.station.delete.queue=station-service.order-station-failed.queue

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

eureka.client.service-url.default-zone=http://localhost:8761/eureka

geocoder.api.key=mock-key-for-testing-only
geocoder.api.url=https://fake-geocode-url.com/

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

spring.cache.type=redis